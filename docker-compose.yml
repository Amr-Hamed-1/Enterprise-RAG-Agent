services:
  api:
    build:
      context: .
      dockerfile: Advanced_RAG_Walmart_project/Dockerfile.api
    image: enterprise-rag-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Advanced_RAG_Walmart_project/Dockerfile.ui
    image: enterprise-rag-ui
    environment:
      - API_BASE=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped
